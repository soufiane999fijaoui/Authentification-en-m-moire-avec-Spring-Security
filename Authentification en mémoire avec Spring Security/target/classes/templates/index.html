<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Spring Security</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; color: #222; }
        .card { max-width: 720px; margin: auto; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        h1 { color: #1f6feb; }
        a.button, button { display: inline-block; margin: 6px 8px 6px 0; padding: 10px 18px; border: none; border-radius: 6px; background: #1f6feb; color: #fff; text-decoration: none; cursor: pointer; font-size: 15px; }
        a.button.secondary { background: #6c757d; }
        .danger { background: #d9534f; }
        .info { margin-top: 20px; padding: 12px; background: #eef4ff; border-left: 4px solid #1f6feb; }
    </style>
</head>
<body>
<div class="card">
    <h1>Bienvenue sur l'application publique</h1>
    <p>Demonstration de l'authentification en memoire avec Spring Security.</p>

    <div class="info" sec:authorize="isAuthenticated()">
        Connecte en tant que <strong sec:authentication="name">utilisateur</strong>
        &mdash; roles : <span sec:authentication="authorities">ROLE_USER</span>
    </div>

    <p>
        <a class="button" th:href="@{/user/dashboard}">Espace utilisateur</a>
        <a class="button" th:href="@{/admin/dashboard}">Espace administrateur</a>
    </p>

    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
        <button type="submit" class="danger">Se deconnecter</button>
    </form>

    <div sec:authorize="!isAuthenticated()">
        <p>Vous n'etes pas connecte.</p>
        <a class="button" th:href="@{/login}">Se connecter</a>
    </div>
</div>
</body>
</html>
