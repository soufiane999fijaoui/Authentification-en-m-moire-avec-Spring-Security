<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Espace utilisateur</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; color: #222; }
        .card { max-width: 720px; margin: auto; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        h1 { color: #2e7d32; }
        a { color: #1f6feb; }
    </style>
</head>
<body>
<div class="card">
    <h1>Espace utilisateur</h1>
    <p>Bienvenue <strong sec:authentication="name">utilisateur</strong>.</p>
    <p>Cette page est accessible avec le role <code>ROLE_USER</code>.</p>
    <p><a th:href="@{/}">Retour a l'accueil</a></p>
</div>
</body>
</html>
